<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Footer — Brutalism</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<footer class="brut">

  <div class="brut__top">
    <div class="brut__mark">
      <span class="mark__box"></span>
      FORMWERK
    </div>
    <div class="brut__style-tag">BRUTALISM</div>
  </div>

  <div class="brut__grid">

    <div class="brut__col brut__col--wide">
      <p class="brut__statement">
        No gradients.<br>
        No shadows.<br>
        Just structure.
      </p>
    </div>

    <div class="brut__col">
      <span class="brut__label">Sitemap</span>
      <a href="#">Work</a>
      <a href="#">Studio</a>
      <a href="#">Archive</a>
      <a href="#">Contact</a>
    </div>

    <div class="brut__col">
      <span class="brut__label">Connect</span>
      <a href="#">GitHub</a>
      <a href="#">Twitter</a>
      <a href="#">Instagram</a>
    </div>

    <div class="brut__col">
      <span class="brut__label">Info</span>
      <a href="#">Terms</a>
      <a href="#">Privacy</a>
      <span class="brut__plain">Lagos, NG</span>
    </div>

  </div>
  <div class="brut__wordmark-wrap">
    <h1 class="brut__wordmark">BRUTALIST</h1>
  </div>

  <div class="brut__bottom">
    <span>© 2026 FORMWERK STUDIO</span>
    <span>BUILT RAW. NO CSS FRAMEWORK USED.</span>
    <span>001</span>
  </div>

</footer>

</body>
</html>
