<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORM / 01 — Architecture for the Unexpected</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="dot-field" aria-hidden="true"></div>

  <div class="hero" id="hero">

    <header class="bar">
      <div class="brand">FORM&nbsp;/&nbsp;01</div>
      <nav class="nav">
        <a href="#">WORK</a>
        <a href="#">ABOUT</a>
        <a href="#">CONTACT</a>
      </nav>
    </header>

    <div class="headline-block">
      <p class="eyebrow">001 — STUDIO MANIFESTO</p>
      <h1 class="headline">
        ARCHITECTURE<br>
        FOR THE<br>
        UNEXPECTED.
      </h1>
    </div>

    <footer class="bar bar--bottom">
      <div class="coords">KANO, NIGERIA — 2026</div>
      <div class="scroll">SCROLL TO EXPLORE&nbsp;↓</div>
    </footer>
  </div>
  
  <!-- Architectural decorative system -->
<div class="geometry" aria-hidden="true">

  <!-- Large construction circle -->
  <div class="geometry__circle"></div>

  <!-- Architectural frame -->
  <div class="geometry__frame"></div>

  <!-- Red construction line -->
  <div class="geometry__line geometry__line--horizontal"></div>
  <div class="geometry__line geometry__line--vertical"></div>

  <!-- Crosshair -->
  <div class="crosshair crosshair--top">
    <span></span>
    <span></span>
  </div>

  <!-- Measurement ticks -->
  <div class="measure">
    <span>00</span>
    <i></i>
    <i></i>
    <i></i>
    <i></i>
    <span>100</span>
  </div>

  <!-- Large ghost number -->
  <div class="ghost-number">01</div>

</div>

<script src="script.js"></script>
</body>
</html>
