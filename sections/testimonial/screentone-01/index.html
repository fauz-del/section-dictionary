<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testimonial — Screentone Pop-art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Added JetBrains Mono for your sub-text rules to keep everything super cohesive -->
<link href="https://googleapis.com" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="testimonial">
  <div class="halftone-field"></div>

  <div class="inner">

    <!-- PHOTO PANEL — Silk-screen frame engine -->
    <div class="photo-panel">
      <div class="photo-wrap">
        <img class="photo" src="photo.jpg" alt="Happy customer portrait">
      </div>
      <span class="panel-label">FIG. 01</span>
    </div>

    <!-- SPEECH BUBBLE CONTENT -->
    <div class="bubble-col">
      <div class="bubble">
        <p class="bubble__text">This is hands down the BEST design system I've ever used. Every section just... works!</p>
        <span class="bubble__tail"></span>
      </div>

      <!-- Comic Accent burst -->
      <div class="burst">WOW!</div>

      <div class="attribution">
        <span class="attribution__name">Kayode A.</span>
        <span class="attribution__role">Product Designer, Lagos</span>
      </div>
    </div>
  </div>

</body>
</html>
