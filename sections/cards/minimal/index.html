<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Builder — Studio Pricing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,480;1,9..144,420&family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ECEEF1;
    --paper-deep:#E3E6EA;
    --ink:#101114;
    --ink-soft:#54565E;
    --rule:#CDD1D7;
    --accent:#3D2BFF;
    --accent-ink:#F2F1FF;
    --fade-neutral:#9A9CA3;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6vw 5vw;
  }

  .page{
    width:100%;
    max-width:1080px;
  }

  /* ---------- eyebrow ---------- */
  .eyebrow-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:'Space Mono', monospace;
    font-size:.72rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding-bottom:1.4rem;
    border-bottom:1px solid var(--rule);
    margin-bottom:clamp(2.2rem,5vw,4rem);
  }
  .eyebrow-row span:last-child{ color:var(--accent); }

  /* ---------- headline ---------- */
  .headline{
    font-family:'Fraunces', serif;
    font-weight:340;
    font-style:normal;
    font-size:clamp(2.6rem, 7vw, 5.4rem);
    line-height:.98;
    letter-spacing:-.01em;
    margin:0 0 clamp(2.6rem,6vw,4.5rem);
    max-width:14ch;
  }
  .headline em{
    font-style:italic;
    font-weight:420;
    color:var(--accent);
  }

  /* ---------- builder shell ---------- */
  .builder{
    display:flex;
    flex-direction:column;
    gap:clamp(2.6rem,5vw,3.6rem);
  }

  /* ---------- slider ---------- */
  .slider-block{ order:1; }

  .slider-labels{
    display:flex;
    justify-content:space-between;
    font-family:'Space Mono', monospace;
    font-size:.68rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--fade-neutral);
    margin-bottom:.9rem;
  }

  .slider-track-wrap{
    position:relative;
    height:52px;
    display:flex;
    align-items:center;
  }

  .track-base{
    position:absolute;
    left:0; right:0; top:50%;
    height:1px;
    background:var(--rule);
    transform:translateY(-50%);
  }

  .track-fill{
    position:absolute;
    left:0; top:50%;
    height:1px;
    background:var(--accent);
    transform:translateY(-50%);
    width:0%;
    transition:none;
  }

  .thumb-visual{
    position:absolute;
    top:50%;
    left:0%;
    width:46px;
    height:46px;
    margin-left:-23px;
    margin-top:-23px;
    border-radius:50%;
    background:var(--ink);
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Mono', monospace;
    font-size:.72rem;
    letter-spacing:.05em;
    pointer-events:none;
    box-shadow:0 0 0 6px var(--paper);
    transition:background .3s ease;
    z-index:2;
  }
  .thumb-visual.hot{ background:var(--accent); }

  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    position:relative;
    z-index:3;
    width:100%;
    height:46px;
    background:transparent;
    margin:0;
    cursor:grab;
  }
  input[type="range"]:active{ cursor:grabbing; }
  input[type="range"]::-webkit-slider-runnable-track{
    -webkit-appearance:none;
    height:46px;
    background:transparent;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:46px;
    height:46px;
    background:transparent;
    border:none;
    cursor:grab;
  }
  input[type="range"]::-moz-range-track{
    height:46px;
    background:transparent;
    border:none;
  }
  input[type="range"]::-moz-range-thumb{
    width:46px;
    height:46px;
    background:transparent;
    border:none;
    cursor:grab;
  }
  input[type="range"]:focus-visible + .thumb-visual,
  input[type="range"]:focus-visible ~ .thumb-visual{
    box-shadow:0 0 0 6px var(--paper), 0 0 0 9px var(--accent);
  }

  /* ---------- content grid ---------- */
  .content-grid{
    order:2;
    display:grid;
    grid-template-columns:minmax(220px,.9fr) 1px 1.1fr;
    gap:clamp(2rem,4vw,3.5rem);
    align-items:start;
  }

  .rule-vertical{
    background:var(--rule);
    align-self:stretch;
  }

  .price-col{ min-width:0; }

  .tier-name{
    font-family:'Space Mono', monospace;
    font-size:.74rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:.6rem;
    transition:color .3s ease;
  }

  .price-line{
    display:flex;
    align-items:flex-start;
    gap:.35rem;
    font-family:'Fraunces', serif;
    font-weight:480;
    line-height:1;
    font-size:clamp(3.6rem, 8vw, 6.4rem);
    letter-spacing:-.02em;
    white-space:nowrap;
  }
  .price-line .currency{
    font-size:.34em;
    margin-top:.5em;
    color:var(--accent);
  }
  .price-cadence{
    font-family:'Space Mono', monospace;
    font-size:.72rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:.7rem;
  }

  .services-col{ min-width:0; }
  .services-header{
    font-family:'Space Mono', monospace;
    font-size:.68rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--fade-neutral);
    margin-bottom:.6rem;
  }

  ul.services-list{
    list-style:none;
    margin:0;
    padding:0;
  }

  .service-item{
    position:relative;
    display:flex;
    align-items:baseline;
    gap:.9rem;
    padding:.82rem 0;
    border-bottom:1px solid var(--rule);
    opacity:1;
    transform:translateX(0);
    max-height:60px;
    overflow:hidden;
    transition:opacity .38s ease, transform .38s ease, max-height .4s ease, padding .4s ease, border-color .4s ease;
  }
  .service-item.entering{
    opacity:0;
    transform:translateX(18px);
  }
  .service-item.leaving{
    opacity:0;
    transform:translateX(-18px);
    max-height:0;
    padding:0;
    border-color:transparent;
  }
  .service-item .num{
    font-family:'Space Mono', monospace;
    font-size:.72rem;
    color:var(--fade-neutral);
    min-width:1.6rem;
  }
  .service-item .name{
    font-size:1.02rem;
    font-weight:500;
    letter-spacing:.01em;
  }
  .service-item .delta{
    position:absolute;
    right:0;
    top:50%;
    transform:translateY(-50%);
    font-family:'Space Mono', monospace;
    font-size:.7rem;
    letter-spacing:.06em;
    animation:deltaFade .9s ease forwards;
  }
  .delta.plus{ color:var(--accent); }
  .delta.minus{ color:var(--fade-neutral); }
  @keyframes deltaFade{
    0%{ opacity:1; transform:translateY(-50%); }
    70%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-140%); }
  }

  /* ---------- cta ---------- */
  .cta-row{ order:3; }
  .cta{
    appearance:none;
    border:1px solid var(--ink);
    background:var(--accent);
    color:var(--accent-ink);
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:1rem;
    letter-spacing:.02em;
    padding:1.05rem 1.6rem;
    width:100%;
    border-radius:2px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.6rem;
    transition:background .25s ease, color .25s ease, border-color .25s ease;
  }
  .cta:hover{
    background:transparent;
    color:var(--ink);
  }
  .cta .arrow{ transition:transform .25s ease; }
  .cta:hover .arrow{ transform:translateX(4px); }

  /* ---------- responsive ---------- */
  @media (max-width:760px){
    .content-grid{
      grid-template-columns:1fr;
      row-gap:2.2rem;
    }
    .rule-vertical{ display:none; }
    .price-line{ font-size:clamp(3.2rem,16vw,4.2rem); }
    .content-grid{ order:1; }
    .slider-block{ order:2; }
    .cta-row{ order:3; }
    .slider-block{
      padding-top:1.6rem;
      border-top:1px solid var(--rule);
    }
    body{ padding:12vw 6vw; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:.001ms !important; animation-duration:.001ms !important; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="eyebrow-row">
    <span>Plan Builder</span>
    <span id="tierCount">01 / 03</span>
  </div>

  <h1 class="headline">How much<br>do you <em>need?</em></h1>

  <div class="builder">

    <div class="slider-block">
      <div class="slider-labels">
        <span>Less</span>
        <span>More</span>
      </div>
      <div class="slider-track-wrap">
        <div class="track-base"></div>
        <div class="track-fill" id="trackFill"></div>
        <input type="range" id="planSlider" min="0" max="100" value="0" step="1" aria-label="Adjust plan scope">
        <div class="thumb-visual" id="thumbVisual">01</div>
      </div>
    </div>

    <div class="content-grid">
      <div class="price-col">
        <div class="tier-name" id="tierName">Starter</div>
        <div class="price-line">
          <span class="currency">$</span><span id="priceValue">450</span>
        </div>
        <div class="price-cadence">per month</div>
      </div>

      <div class="rule-vertical"></div>

      <div class="services-col">
        <div class="services-header">Included</div>
        <ul class="services-list" id="servicesList"></ul>
      </div>
    </div>

    <div class="cta-row">
      <button class="cta">Get started <span class="arrow">→</span></button>
    </div>

  </div>
</div>

<script>
(function(){
  const tiers = [
    { name:'Starter',     price:450,  services:['Website','Basic SEO','Support'] },
    { name:'Studio',      price:900,  services:['Website','SEO','Strategy','Analytics','Support'] },
    { name:'Full Service', price:1500, services:['Website','Brand Identity','SEO','Strategy','Analytics','Priority Support'] }
  ];

  const slider      = document.getElementById('planSlider');
  const trackFill    = document.getElementById('trackFill');
  const thumbVisual  = document.getElementById('thumbVisual');
  const priceValueEl = document.getElementById('priceValue');
  const tierNameEl   = document.getElementById('tierName');
  const tierCountEl  = document.getElementById('tierCount');
  const listEl       = document.getElementById('servicesList');

  let displayedPrice = tiers[0].price;
  let targetPrice     = tiers[0].price;
  let currentTierIdx  = 0;
  let currentServices = [...tiers[0].services];
  const pendingRemovals = [];

  function lerp(a,b,t){ return a + (b-a) * t; }

  function priceAt(v){
    if (v <= 50) return lerp(tiers[0].price, tiers[1].price, v/50);
    return lerp(tiers[1].price, tiers[2].price, (v-50)/50);
  }

  function tierIndexAt(v){
    if (v < 25) return 0;
    if (v < 75) return 1;
    return 2;
  }

  function renderNumber(idx){
    tierNameEl.textContent = tiers[idx].name;
    tierCountEl.textContent = '0' + (idx+1) + ' / 03';
    thumbVisual.textContent = '0' + (idx+1);
  }

  function buildItem(text, cls){
    const li = document.createElement('li');
    li.className = 'service-item' + (cls ? (' ' + cls) : '');
    li.dataset.name = text;
    li.innerHTML = '<span class="num"></span><span class="name">' + text + '</span>';
    return li;
  }

  function renumber(){
    const visible = Array.from(listEl.children).filter(li => !li.classList.contains('leaving'));
    visible.forEach((li, i) => {
      li.querySelector('.num').textContent = String(i+1).padStart(2,'0');
    });
  }

  function initList(idx){
    listEl.innerHTML = '';
    tiers[idx].services.forEach(name => {
      listEl.appendChild(buildItem(name, null));
    });
    renumber();
  }

  function transitionList(newIdx){
    const oldList = currentServices;
    const newList = tiers[newIdx].services;
    const removed = oldList.filter(n => !newList.includes(n));
    const added   = newList.filter(n => !oldList.includes(n));

    // clear any leftover leaving nodes from a rapid re-drag
    pendingRemovals.forEach(t => clearTimeout(t));
    pendingRemovals.length = 0;
    Array.from(listEl.querySelectorAll('.service-item.leaving')).forEach(n => n.remove());

    // mark removed items as leaving (if still present)
    removed.forEach(name => {
      const node = Array.from(listEl.children).find(li => li.dataset.name === name && !li.classList.contains('leaving'));
      if (node){
        const badge = document.createElement('span');
        badge.className = 'delta minus';
        badge.textContent = '\u2212';
        node.appendChild(badge);
        requestAnimationFrame(() => node.classList.add('leaving'));
        const t = setTimeout(() => node.remove(), 420);
        pendingRemovals.push(t);
      }
    });

    // append new items in correct final order
    added.forEach(name => {
      const li = buildItem(name, 'entering');
      const badge = document.createElement('span');
      badge.className = 'delta plus';
      badge.textContent = '+';
      li.appendChild(badge);
      listEl.appendChild(li);
      requestAnimationFrame(() => requestAnimationFrame(() => li.classList.remove('entering')));
    });

    renumber();
    currentServices = newList;
  }

  function handleSlider(){
    const v = Number(slider.value);
    targetPrice = priceAt(v);
    trackFill.style.width = v + '%';
    thumbVisual.style.left = v + '%';
    thumbVisual.classList.add('hot');

    const idx = tierIndexAt(v);
    if (idx !== currentTierIdx){
      currentTierIdx = idx;
      renderNumber(idx);
      transitionList(idx);
    }
  }

  slider.addEventListener('input', handleSlider);
  slider.addEventListener('pointerup', () => thumbVisual.classList.remove('hot'));
  slider.addEventListener('touchend', () => thumbVisual.classList.remove('hot'));

  function animate(){
    displayedPrice += (targetPrice - displayedPrice) * 0.16;
    if (Math.abs(targetPrice - displayedPrice) < 0.5) displayedPrice = targetPrice;
    priceValueEl.textContent = Math.round(displayedPrice).toLocaleString('en-US');
    requestAnimationFrame(animate);
  }

  // init
  initList(0);
  renderNumber(0);
  requestAnimationFrame(animate);
})();
</script>

</body>
</html>
